
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Misael</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f4f5;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 100%;
            max-width: 600px;
            height: 90vh;
            background: white;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .chat-header {
            background: #202124;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .message {
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 10px;
            max-width: 85%;
            line-height: 1.5;
        }

        .user {
            background: #dbeafe;
            margin-left: auto;
        }

        .bot {
            background: #f1f1f1;
            margin-right: auto;
        }

        .chat-form {
            display: flex;
            gap: 10px;
            padding: 15px;
            border-top: 1px solid #ddd;
        }

        .chat-form input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
        }

        .chat-form button {
            padding: 12px 20px;
            background: #202124;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="chat-container">

        <header class="chat-header">
            <h2>Chat Misael</h2>
            <p>Assistente de Inteligência Artificial</p>
        </header>

        <main class="chat-messages" id="messages">

            <div class="message bot">
                Olá! Como posso ajudar você hoje?
            </div>

        </main>

        <form class="chat-form" id="chat-form">

            <input
                type="text"
                id="message-input"
                placeholder="Digite sua mensagem..."
                autocomplete="off"
                required
            >

            <button type="submit">Enviar</button>

        </form>

    </div>


<script>
    // 1. Pegando os elementos do HTML
    const form = document.getElementById("chat-form");
    const input = document.getElementById("message-input");
    const messages = document.getElementById("messages");

    // 2. Função para adicionar mensagens na tela
    function adicionarMensagem(texto, tipo) {
        const div = document.createElement("div");

        div.classList.add("message", tipo);
        div.textContent = texto;

        messages.appendChild(div);

        // Rola a conversa para a última mensagem
        messages.scrollTop = messages.scrollHeight;
    }

    // 3. Capturando o envio do formulário
    form.addEventListener("submit", async function(event) {
        event.preventDefault();

        const mensagem = input.value.trim();

        if (!mensagem) {
            return;
        }

        // Mostra a mensagem do usuário
        adicionarMensagem(mensagem, "user");

        input.value = "";

        try {
            // 4. Enviando a mensagem para o Django
            const resposta = await fetch("/api/chat/", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    message: mensagem
                })
            });

            // 5. Convertendo a resposta para JSON
            const dados = await resposta.json();

            if (!resposta.ok) {
                throw new Error(dados.erro || "Erro ao enviar mensagem.");
            }

            // 6. Mostrando a resposta do backend
            adicionarMensagem(dados.response, "bot");

        } catch (erro) {
            adicionarMensagem(
                "Erro: " + erro.message,
                "bot"
            );
        }
    });
</script>



</body>
</html>
