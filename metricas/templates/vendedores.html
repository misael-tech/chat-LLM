<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Vendedores</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 100%);
            min-height: 100vh;
            padding: 32px 16px;
            color: #1e293b;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .page-wrapper {
            width: 100%;
            max-width: 680px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* Barra superior de navegação */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .page-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #0f172a;
            letter-spacing: -0.02em;
        }

        .top-bar > a {
            text-decoration: none;
        }

        .top-bar > a button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #ffffff;
            border: none;
            padding: 10px 18px;
            border-radius: 12px;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15);
            transition: all 0.2s ease;
        }

        .top-bar > a button::after {
            content: "→";
            font-size: 1rem;
            line-height: 1;
        }

        .top-bar > a button:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(15, 23, 42, 0.22);
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
        }

        /* Card do formulário */
        .form-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 28px;
            box-shadow: 0 15px 35px -15px rgba(15, 23, 42, 0.12), 0 0 1px rgba(15, 23, 42, 0.08);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        label {
            font-size: 0.88rem;
            font-weight: 600;
            color: #334155;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 12px 16px;
            background: #f8fafc;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            font-family: inherit;
            font-size: 0.95rem;
            color: #0f172a;
            outline: none;
            transition: all 0.2s ease;
        }

        input[type="text"]::placeholder,
        input[type="number"]::placeholder {
            color: #94a3b8;
        }

        input[type="text"]:focus,
        input[type="number"]:focus {
            background: #ffffff;
            border-color: #2563eb;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        form button[type="submit"] {
            margin-top: 6px;
            width: 100%;
            padding: 14px 20px;
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.25);
            transition: all 0.2s ease;
        }

        form button[type="submit"]:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.32);
            background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
        }

        form button[type="submit"]:active {
            transform: translateY(0);
        }

        /* Card da listagem de vendedores */
        .list-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 26px 28px;
            box-shadow: 0 15px 35px -15px rgba(15, 23, 42, 0.12), 0 0 1px rgba(15, 23, 42, 0.08);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }

        h2 {
            font-size: 1.15rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #f1f5f9;
        }

        .vendedores-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .vendedores-list > p {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 500;
            color: #1e293b;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s ease;
        }

        .vendedores-list > p:hover {
            background: #f1f5f9;
            border-color: #cbd5e1;
            transform: translateX(3px);
        }

        .empty-state {
            text-align: center;
            color: #64748b !important;
            background: #f8fafc !important;
            border-style: dashed !important;
            justify-content: center !important;
            font-weight: 400 !important;
        }

        @media (max-width: 540px) {
            body {
                padding: 20px 12px;
            }

            .form-card,
            .list-card {
                padding: 20px;
                border-radius: 16px;
            }

            .vendedores-list > p {
                flex-direction: column;
                align-items: flex-start;
                gap: 4px;
            }
        }
    </style>
</head>
<body>

    <div class="page-wrapper">
        <div class="top-bar">
            <h1 class="page-title">Cadastro de Vendedores</h1>
            <a href="{% url 'chat' %}">
                <button type="button">Ir Chat</button>
            </a>
        </div>

        <section class="form-card">
            <form method="POST">
                {% csrf_token %}

                <div class="form-group">
                    <label>Nome do vendedor</label>
                    <input type="text" name="nome" placeholder="Digite o nome" required>
                </div>

                <div class="form-group">
                    <label>Meta de vendas (R$)</label>
                    <input type="number" name="meta" step="0.01" min="0.01" placeholder="Ex: 10000.00" required>
                </div>

                <button type="submit">Cadastrar vendedor</button>
            </form>
        </section>

        <section class="list-card">
            <h2>Vendedores cadastrados</h2>

            <div class="vendedores-list">
                {% for vendedor in vendedores %}
                    <p>
                        {{ vendedor.nome }} — Meta: R$ {{ vendedor.meta }}
                    </p>
                {% empty %}
                    <p class="empty-state">Nenhum vendedor cadastrado.</p>
                {% endfor %}
            </div>
        </section>
    </div>

</body>
</html>
